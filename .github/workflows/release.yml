name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ffmpeg python3-pil
          python3 -m pip install --upgrade pip build

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

      - name: Build wheel, sdist, and zipapp
        run: |
          rm -rf release
          mkdir -p release
          python3 -m build --outdir release
          stage="$(mktemp -d)"
          cp -r shotguard "$stage/"
          python3 -m zipapp "$stage" -o release/shotguard.pyz -p "/usr/bin/env python3" -m "shotguard.cli:main"
          chmod +x release/shotguard.pyz
          rm -rf "$stage"
          (cd release && sha256sum * > checksums.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG"
          fi
          gh release upload "$TAG" release/* --clobber

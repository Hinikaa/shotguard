[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shotguard"
version = "0.1.0"
description = "OCR secret scanner for images and video attachments in GitHub Issues, PRs, and repositories."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hinikaa" }]
keywords = ["security", "secrets", "ocr", "tesseract", "github-actions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
shotguard = "shotguard.cli:main"

[tool.setuptools.packages.find]
include = ["shotguard*"]
